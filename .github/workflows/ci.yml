name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Convert the example and check its structure
        run: |
          md2canoprof examples/tp_led.md -o /tmp/tp_led.scar
          canoprof-check /tmp/tp_led.scar
      - run: bash -n tools/export_figures.sh
